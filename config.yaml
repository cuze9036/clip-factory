# Clip Factory settings. Secrets go in .env, never here.

timezone: America/New_York        # posting slots are US Eastern time

watcher:
  every_minutes: 5                # about how often to check sources (varies 4-6 min); new sources are checked at once
  lookback_days: 3                # ignore videos older than this
  min_duration_s: 120             # skip YouTube/Twitch videos shorter than this (already a short)
  min_file_duration_s: 15         # campaign footage (folders, Dropbox) can be short; skip only tiny files
  dropbox_every_hours: 6          # re-download a Dropbox share link this often to pick up new files
  dropbox_retry_minutes: 2        # a failed or stalled download starts again this soon
  dropbox_max_gb: 20

moments:
  english_only: true              # skip videos whose speech isn't English (campaigns target US viewers)
  route: auto                     # auto = Gemini watches the YouTube URL, falls back to transcript
  chunk_minutes: 30               # Gemini watches long streams in chunks of this size
  fps: 0.5                        # frames per second Gemini samples (lower = fewer tokens)
  max_per_chunk: 4
  preroll_s: 1.0                  # seconds kept before each moment's start

download:
  max_height: 1080
  cookies_file: ""                # optional cookies.txt if YouTube asks to sign in
  backlog_per_campaign: 6         # stop downloading new moments while this many clips wait for review

whisper:
  model: small.en                 # large-v3 is better but slow without a GPU
  device: auto
  compute_type: int8

render:
  width: 1080
  height: 1920
  max_fps: 60
  crf: 20
  preset: medium
  encoder: auto                   # auto = NVIDIA GPU (NVENC) when available, else CPU; or nvenc / cpu
  font: Montserrat                # downloaded into assets/fonts by the installer
  fonts_dir: assets/fonts
  caption_size: 84
  words_per_group: 3
  highlight_color: "&H0000D4FF&"  # ASS colour (BGR): #FFD400 yellow
  hook_seconds: 2.5
  blur_fg_height: 760             # gameplay height in the blur layout
  style: auto                     # auto = a researched viral style per clip (bold_crop, word_pop, blur_box,
                                  # black_title, meme_top, split), or name one; "framed" = the old white look
  default_layout: framed          # older layouts, used only when style is "framed"
  framed_background: white        # white | blur | black (framed layout)
  framed_video_top: 576           # pixels from the top where the video starts
  framed_max_video_height: 1000
  framed_words_per_group: 2
  title_size: 72
  loudness_lufs: -14
  music_dir: assets/music         # royalty-free tracks; leave empty for none
  music_gain_db: -20

effects:                          # what makes a clip look edited (see clipfactory/effects.py)
  enabled: true
  face_tracking: true             # keep the speaker's face in the 9:16 frame (OpenCV YuNet, downloaded once)
  cut_pauses_over: 0.7            # jump-cut pauses longer than this (seconds)
  max_zooms: 3                    # punch zooms on the strongest words
  hook_seconds: 1.8               # big hook text over the first seconds (full-screen styles)
  sfx_volume: 0.35                # whoosh under each punch zoom

llm:
  # Watching videos: only providers with video: true (Gemini). Text work (titles, guides, campaign pages,
  # reviews, error notes, moments from transcripts) tries text_order first, so the free models do most of it
  # and Gemini's quota is kept for watching videos. Providers with no key set are skipped.
  text_order: [free-llm, gemini, ollama]
  providers:
    - name: gemini
      type: gemini
      model: gemini-3.5-flash     # Google retired gemini-2.5-flash for new keys
      api_key_env: GEMINI_API_KEY
      video: true                 # can watch YouTube URLs directly
    - name: free-llm
      type: openai                # any OpenAI-compatible API
      base_url_env: FREE_LLM_BASE_URL
      api_key_env: FREE_LLM_API_KEY
      model_env: FREE_LLM_MODEL
    - name: ollama
      type: openai
      base_url: http://localhost:11434/v1
      api_key: ollama
      model: llama3.1:8b
      optional: true              # skip silently when Ollama is not running

schedule:
  # US Eastern times. From 2026 posting-time studies (Buffer, Sprout Social, Metricool): Reels, Shorts and TikTok
  # peak in the evening (6-10 PM ET, which is also afternoon on the West Coast), Facebook during the day,
  # X in the morning and around lunch.
  platform_slots:                 # platforms the tool posts by itself
    youtube:   ["12:00", "15:30", "18:00", "20:00", "22:00"]
    instagram: ["12:00", "15:00", "18:30", "20:00", "21:30"]
    facebook:  ["09:30", "12:30", "15:00", "18:00", "20:00"]
    tiktok:    ["12:30", "17:00", "19:00", "20:30", "22:00"]
    x:         ["08:30", "10:00", "12:30", "15:00", "17:30"]
  # Platforms you post by hand: good US times when you're awake in India
  # (in winter, ET 12:00-12:30 = 22:30-23:00 IST, ET 20:00-22:00 = 06:30-08:30 IST, ET 08:30-10:00 = 19:00-20:30 IST).
  manual_slots:
    youtube:   ["12:00", "20:30", "22:00"]
    instagram: ["12:00", "20:00", "21:30"]
    facebook:  ["09:30", "12:30", "20:00"]
    tiktok:    ["12:30", "20:00", "21:30"]
    x:         ["08:30", "10:00", "12:30"]
  slots: ["09:00", "12:30", "16:00", "19:00", "21:30"]   # any other platform
  platform_offset_min: {youtube: 0, tiktok: 60, instagram: 90, facebook: 120, x: 150}   # only with "slots"
  max_posts_per_account_per_day: 5
  min_gap_minutes: 120
  slot_jitter_min: 12             # each post goes out at a random time up to 12 min before/after its slot
  youtube_uploads_per_day: 10     # an upload costs 100 quota units of the default 10,000 a day (Google, 2026)

stats:
  every_hours: 6

review:
  auto_approve_score: 9           # clips the AI scores this high post by themselves; 11 = review everything
  dashboard_url: http://127.0.0.1:8787

discovery:                        # finds new clipping campaigns and suggests them on Discord
  enabled: true
  every_hours: 6                  # each run uses Apify credit (free plan); lower it in config.local.yaml if you
                                  # have credit to spare. #campaign-feed brings announcements for free, any time.
  apify_actor: fayoussef~whop-clipping-campaigns-scraper   # reads Whop's public campaign listings
  apify_input: {}
  max_listings: 40
  max_suggestions_per_run: 5
  min_rate_per_1k: 0.5            # skip campaigns paying less than this
  min_budget_left: 500            # skip campaigns with less budget left than this (USD)
  interests: []                   # e.g. ["gta", "gaming", "stream", "podcast"]; empty = any topic

discord:
  insights_channel: ai-insights       # weekly AI review + daily check (made by the bot if missing)
  updates_channel: campaign-updates   # live campaigns you could join, with priority tags (kept up to date)
  active_channel: active-campaigns    # the campaigns the tool is running, with clips, views and earnings
  feed_channel: campaign-feed     # follow clipping communities' announcement channels into this channel;
                                  # the bot reads every post there and turns campaigns into suggestions

insights:                         # weekly self-review with the free AI (Gemini / Free LLM API)
  enabled: true
  every_days: 7
  daily_check_hours: 24           # daily check of problems (errors, stuck work, missed posts, budgets)
  autofix: true                   # fix safe problems by itself (retries, Telegram fallback, reminders)
  autofix_every_minutes: 5        # safe fixes + bug reports; errors are explained at most once a day each
  autofix_max_tries: 2            # each failed item is retried at most this many times
  min_posts: 5                    # posts with views needed before it gives advice or changes anything

gmail_watch:                      # reads Google's YouTube API audit emails (read-only) and posts them to Discord
  enabled: true                   # does nothing until you run: clipfactory auth-gmail main
  account: main
  every_minutes: 30
  max_per_run: 10
  query: 'from:google (youtube api OR "api compliance" OR quota OR audit) newer_than:7d'

accounts:
  gmail:
    main:                         # the Google account that owns the clip-factory Cloud project
      client_secrets: secrets/client_secret.json
      token_file: secrets/gmail_main.json
  youtube:
    main:
      client_secrets: secrets/client_secret.json
      token_file: secrets/youtube_main.json
  instagram:
    main:
      user_id_env: IG_MAIN_USER_ID
      token_env: IG_MAIN_TOKEN
  facebook:
    main:
      page_id_env: FB_MAIN_PAGE_ID
      token_env: FB_MAIN_PAGE_TOKEN

# Platforms where the tool prepares each clip and you post it yourself: the video and caption land on
# Telegram, and you mark it live on Discord with !posted.
# A platform with its keys set in .env posts automatically instead.
# Add tiktok only if you can use TikTok where you are (it is blocked in India).
manual_platforms: [instagram, facebook, tiktok, x]
manual_posting:                   # clips you post by hand
  deliver_hours_before: 24        # video + caption reach Telegram this long before the posting time
  remind_minutes_before: 30       # Discord reminds you this long before the posting time
owner_timezone: Asia/Kolkata      # reminders show this time next to US Eastern
always_manual: []                 # platforms you always post by hand even when the API works

graph_api_version: v21.0

update:
  github_repo: cuze9036/clip-factory   # the laptop installs new commits from here within about a minute
