<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Clip Factory{% endblock %}</title>
<style>
:root{
  --bg:#f3f4f7;--panel:#fff;--fg:#14171f;--muted:#5d6475;--line:#dfe2ea;--soft:#eceef3;
  --accent:#e0531a;--accent-soft:#fdece4;--ok:#178a5b;--ok-soft:#e1f4ec;--warn:#a86400;--warn-soft:#fbf0dc;
  --bad:#c0322b;--bad-soft:#fbe7e5;--ai:#6f4ad6;--ai-soft:#efe9fd;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101318;--panel:#181c23;--fg:#e7e9ee;--muted:#9aa1b1;--line:#2a2f3a;--soft:#20252e;
  --accent:#ff8250;--accent-soft:#3a2219;--ok:#4fd29b;--ok-soft:#17302a;--warn:#f0b54a;--warn-soft:#3a2e17;
  --bad:#ff7d74;--bad-soft:#3b1d1b;--ai:#b39cff;--ai-soft:#2a2342;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Inter,sans-serif}
a{color:inherit}
header{display:flex;align-items:center;gap:24px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;text-decoration:none}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;padding:6px 12px;border-radius:6px;color:var(--muted);font-weight:500}
nav a.on,nav a:hover{background:var(--soft);color:var(--fg)}
.badge{font:600 11px var(--mono);background:var(--accent);color:#fff;border-radius:9px;padding:1px 7px;margin-left:4px}
main{max-width:1240px;margin:0 auto;padding:28px;display:flex;flex-direction:column;gap:28px}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 12px;letter-spacing:-.005em}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{color:var(--muted);font-size:13px}
.chip{display:inline-block;font:600 11px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:1px 8px;border-radius:4px;background:var(--soft);color:var(--muted)}
.chip.running{background:var(--ok-soft);color:var(--ok)}
.chip.paused,.chip.ended{background:var(--warn-soft);color:var(--warn)}
.chip.budget{background:var(--bad-soft);color:var(--bad)}
.chip.demo{background:var(--ai-soft);color:var(--ai)}
.chip.ai{background:var(--ai-soft);color:var(--ai)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;text-align:right}
button,.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:6px 12px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:var(--soft)}
button.go{background:var(--ok);border-color:var(--ok);color:#fff}
button.no{color:var(--bad)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.scroll{overflow-x:auto}
@media(max-width:600px){main{padding:20px 16px}header{padding:12px 16px}}
</style>
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('overview') }}"><i></i>Clip Factory</a>
  <nav>
    <a href="{{ url_for('overview') }}" class="{{ 'on' if request.endpoint in ('overview','campaign') }}">Lanes</a>
    <a href="{{ url_for('campaigns_page') }}" class="{{ 'on' if request.endpoint in ('campaigns_page','campaign_new','campaign_edit','campaign_extract','campaign_save') }}">Campaigns</a>
    <a href="{{ url_for('review_page') }}" class="{{ 'on' if request.endpoint=='review_page' }}">Review{% if review_count %}<span class="badge">{{ review_count }}</span>{% endif %}</a>
    <a href="{{ url_for('posts') }}" class="{{ 'on' if request.endpoint=='posts' }}">Posts{% if submit_count %}<span class="badge">{{ submit_count }} to submit</span>{% endif %}</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
